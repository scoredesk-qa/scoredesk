        .toast.err { border-color: var(--red); color: var(--red); }

<script>
    const SUPABASE_URL = 'https://qbvjgiamqzkscdykenvi.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFidmpnaWFtcXprc2NkeWtlbnZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwMzUxMTIsImV4cCI6MjA5MDYxMTExMn0.OeV5qa9y_PCGw6nG0wbfPfiMBjYC_jvzsUXHOip1RTU';

    let sb = null;
    let currentUser = null;
    let isAdmin = false;
    let currentAgentName = null;

    let allDaysData = {};
    let DATA = null;
    let activeAgent = null;
    let sortCol = 'start', sortDir = 1;
    let dashboardBuilt = false;

    const COLORS = ['#4f8cff','#3b82f6','#22c55e','#a78bfa','#ec4899','#14b8a6','#eab308','#ef4444','#6366f1','#84cc16'];
    const agentColor = (agent) => COLORS[Math.abs(agent.split('').reduce((a,b)=>a+b.charCodeAt(0),0) % COLORS.length)];

    function showToast(msg, isOk) {
        const t = document.createElement('div');
        t.className = 'toast' + (isOk === true ? ' ok' : isOk === false ? ' err' : '');
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.classList.add('show'), 10);
        setTimeout(() => {
            t.classList.remove('show');
            setTimeout(() => t.remove(), 500);
        }, 4000);
    }

    function timeToSec(t) { let [h,m,s] = t.split(':').map(Number); return h*3600 + m*60 + (s||0); }

    window.showTip = (e, html) => {
        const tip = document.getElementById('tooltip');
        tip.innerHTML = html;
        tip.style.opacity = 1;
        const move = (e) => {
            let x = e.clientX + 14, y = e.clientY - 10;
            if (x + 200 > window.innerWidth) x = e.clientX - 210;
            tip.style.left = x + 'px';
            tip.style.top = y + 'px';
        };
        move(e);
        window.tipMove = move;
    };
    window.hideTip = () => { document.getElementById('tooltip').style.opacity = 0; };
    document.addEventListener('mousemove', (e) => { if (document.getElementById('tooltip').style.opacity === '1' && window.tipMove) window.tipMove(e); });

    function fmtSecs(s) { let m = Math.floor(s/60), sec = s%60; return m>0 ? `${m}m ${sec}s` : `${sec}s`; }
    function durClass(secs) { if (secs < 60) return 'dur-short'; if (secs < 180) return 'dur-medium'; return 'dur-long'; }

    function distributeSessionToBuckets(startSec, endSec, minBucketSec, maxBucketSec, bucketInterval=1800) {
        const buckets = new Map();
        let curStart = Math.max(startSec, minBucketSec);
        const end = endSec;
        if (curStart >= end) return buckets;
        let bucketStart = Math.floor(curStart / bucketInterval) * bucketInterval;
        while (bucketStart < end && bucketStart < maxBucketSec) {
            const bucketEnd = bucketStart + bucketInterval;
            const overlapStart = Math.max(curStart, bucketStart);
            const overlapEnd = Math.min(end, bucketEnd);
            if (overlapStart < overlapEnd) {
                const overlapSec = overlapEnd - overlapStart;
                buckets.set(bucketStart, (buckets.get(bucketStart) || 0) + overlapSec);
            }
            bucketStart += bucketInterval;
        }
        return buckets;
    }

    function buildDataForDate(rows, dateStr) {
        if (!rows.length) return null;
        const sessions = rows.map(r => ({
            agent: r.agent,
            start: r.start,
            end: r.end,
            startSec: timeToSec(r.start),
            endSec: timeToSec(r.end),
            secs: (timeToSec(r.end) - timeToSec(r.start) + 86400) % 86400 || 0
        })).filter(s => s.secs > 0);
        if (!sessions.length) return null;

        const allStarts = sessions.map(s => s.startSec);
        const allEnds = sessions.map(s => s.endSec);
        const minSec = Math.min(...allStarts);
        const maxSec = Math.max(...allEnds);
        const bucketInterval = 1800;
        const firstBucket = Math.floor(minSec / bucketInterval) * bucketInterval;
        const lastBucket = Math.ceil(maxSec / bucketInterval) * bucketInterval;
        const bucketStarts = [];
        for (let t = firstBucket; t < lastBucket; t += bucketInterval) bucketStarts.push(t);
        const bucketLabels = bucketStarts.map(bs => { let h = Math.floor(bs/3600), m = (bs%3600)/60; return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`; });

        const agents = [...new Set(sessions.map(s => s.agent))].sort();
        const timeline = {};
        agents.forEach(ag => { timeline[ag] = {}; bucketLabels.forEach(bl => timeline[ag][bl] = 0); });
        const bucketTotals = {};
        bucketLabels.forEach(bl => bucketTotals[bl] = 0);

        for (const sess of sessions) {
            const bucketMap = distributeSessionToBuckets(sess.startSec, sess.endSec, firstBucket, lastBucket, bucketInterval);
            for (let [bucketStart, overlapSec] of bucketMap.entries()) {
                const idx = bucketStarts.indexOf(bucketStart);
                if (idx === -1) continue;
                const label = bucketLabels[idx];
                timeline[sess.agent][label] += overlapSec;
                bucketTotals[label] += overlapSec;
            }
        }

        const summary = agents.map(ag => {
            const agentRows = sessions.filter(s => s.agent === ag);
            const total_secs = agentRows.reduce((s,r)=>s+r.secs,0);
            const sessionsCount = agentRows.length;
            const avg_secs = sessionsCount ? total_secs/sessionsCount : 0;
            const max_secs = sessionsCount ? Math.max(...agentRows.map(r=>r.secs)) : 0;
            return { agent: ag, total_secs, sessions: sessionsCount, avg_secs, max_secs, total_mins: +(total_secs/60).toFixed(1) };
        });
        const grand_total_secs = summary.reduce((s,ag)=>s+ag.total_secs,0);
        const team_avg_secs = agents.length ? grand_total_secs/agents.length : 0;

        const displayRows = sessions.map(s => ({
            agent: s.agent,
            start: s.start,
            end: s.end,
            duration: fmtSecs(s.secs),
            secs: s.secs
        }));

        return {
            date: dateStr,
            agents,
            buckets: bucketLabels,
            summary,
            timeline,
            rows: displayRows,
            bucket_totals: bucketTotals,
            grand_total_secs,
            team_avg_secs
        };
    }

    // ----- Save sessions with manual duplicate check -----
    async function saveSessionRows(rows) {
        let inserted = 0;
        let skipped = 0;
        for (const row of rows) {
            // Validate time format
            if (!/^\d{2}:\d{2}:\d{2}$/.test(row.start) || !/^\d{2}:\d{2}:\d{2}$/.test(row.end)) {
                console.warn(`Skipping invalid time: ${row.agent} ${row.start} - ${row.end}`);
                continue;
            }
            const { data: existing, error: checkError } = await sb
                .from('admin_sessions')
                .select('id')
                .eq('date', row.date)
                .eq('agent_name', row.agent)
                .eq('start_time', row.start)
                .eq('end_time', row.end)
                .maybeSingle();

            if (checkError) {
                console.error('Duplicate check error:', checkError);
                showToast(`Error checking duplicate for ${row.agent} ${row.start}: ${checkError.message}`, false);
                return false;
            }

            if (existing) {
                skipped++;
                continue;
            }

            const { error: insertError } = await sb
                .from('admin_sessions')
                .insert({
                    date: row.date,
                    agent_name: row.agent,
                    start_time: row.start,
                    end_time: row.end,
                    duration_seconds: row.secs,
                    uploaded_by: currentUser.id
                });

            if (insertError) {
                console.error('Insert error:', insertError);
                showToast(`Error saving ${row.agent} ${row.start}: ${insertError.message}`, false);
                return false;
            }
            inserted++;
        }
        showToast(`Saved ${inserted} new sessions (${skipped} duplicates skipped)`, true);
        return true;
    }

    async function loadSessionsFromSupabase() {
        if (!currentUser) return [];
        let query = sb.from('admin_sessions').select('*');
        if (!isAdmin && currentAgentName) {
            query = query.eq('agent_name', currentAgentName);
        }
        const { data, error } = await query.order('date', { ascending: true });
        if (error) {
            console.error('Load error:', error);
            showToast('Failed to load sessions: ' + error.message, false);
            return [];
        }
        return data || [];
    }

    async function refreshFromSupabase() {
        const sessions = await loadSessionsFromSupabase();
        if (sessions.length === 0) {
            document.getElementById('upload-zone').style.display = isAdmin ? 'flex' : 'none';
            document.getElementById('dashboard-content').style.display = 'none';
            document.getElementById('addFilesButton').style.display = 'none';
            return;
        }
        const grouped = {};
        for (const s of sessions) {
            if (!grouped[s.date]) grouped[s.date] = [];
            grouped[s.date].push({
                agent: s.agent_name,
                start: s.start_time,
                end: s.end_time,
                secs: s.duration_seconds
            });
        }
        const newAllDays = {};
        for (const [date, rows] of Object.entries(grouped)) {
            const built = buildDataForDate(rows, date);
            if (built) newAllDays[date] = built;
        }
        allDaysData = newAllDays;
        if (Object.keys(allDaysData).length === 0) {
            document.getElementById('upload-zone').style.display = isAdmin ? 'flex' : 'none';
            document.getElementById('dashboard-content').style.display = 'none';
            document.getElementById('addFilesButton').style.display = 'none';
            return;
        }
        document.getElementById('upload-zone').style.display = 'none';
        document.getElementById('dashboard-content').style.display = '';
        if (isAdmin) document.getElementById('addFilesButton').style.display = 'inline-block';
        setActiveDate(Object.keys(allDaysData).sort()[0]);
    }

    // ----- Robust CSV parsing -----
    function parseCSVLine(line) {
        const result = [];
        let cur = '';
        let inQuotes = false;
        for (let ch of line) {
            if (inQuotes) {
                if (ch === '"') inQuotes = false;
                else cur += ch;
            } else {
                if (ch === '"') inQuotes = true;
                else if (ch === ',') {
                    result.push(cur.trim());
                    cur = '';
                } else cur += ch;
            }
        }
        result.push(cur.trim());
        return result;
    }

    function isHeaderRow(cols) {
        const lower = cols.map(c => c.toLowerCase());
        return lower.some(c => c === 'date' || c === 'agent' || c === 'name') &&
               lower.some(c => c === 'start' || c === 'start_time') &&
               lower.some(c => c === 'end' || c === 'end_time');
    }

    function extractDateFromFilename(fname) {
        const match = fname.match(/(\d{4}-\d{2}-\d{2})/);
        return match ? match[1] : null;
    }

    async function processFiles(files) {
        if (!isAdmin) {
            showToast('Only administrators can upload files.', false);
            return;
        }
        let allRows = [];
        for (const file of files) {
            try {
                let text = await file.text();
                // Remove BOM
                if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
                const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
                if (lines.length === 0) continue;

                let startIdx = 0;
                let colMap = null; // { dateIdx, agentIdx, startIdx, endIdx }

                // Check first line for header
                const firstCols = parseCSVLine(lines[0]);
                if (isHeaderRow(firstCols)) {
                    console.log('Detected header row:', firstCols);
                    const lower = firstCols.map(c => c.toLowerCase());
                    colMap = {
                        dateIdx: lower.findIndex(c => c === 'date'),
                        agentIdx: lower.findIndex(c => c === 'agent' || c === 'name'),
                        startIdx: lower.findIndex(c => c === 'start' || c === 'start_time'),
                        endIdx: lower.findIndex(c => c === 'end' || c === 'end_time')
                    };
                    startIdx = 1;
                } else {
                    // No header – assume column order: date, agent, start, end
                    colMap = { dateIdx: 0, agentIdx: 1, startIdx: 2, endIdx: 3 };
                    startIdx = 0;
                }

                for (let i = startIdx; i < lines.length; i++) {
                    const cols = parseCSVLine(lines[i]);
                    if (cols.length < 4) continue;
                    const dateVal = cols[colMap.dateIdx]?.trim();
                    const agent = cols[colMap.agentIdx]?.trim();
                    const start = cols[colMap.startIdx]?.trim();
                    const end = cols[colMap.endIdx]?.trim();
                    if (!dateVal || !agent || !start || !end) continue;
                    if (!/^\d{4}-\d{2}-\d{2}$/.test(dateVal)) continue;
                    if (!/^\d{2}:\d{2}:\d{2}$/.test(start) || !/^\d{2}:\d{2}:\d{2}$/.test(end)) continue;
                    const secs = (timeToSec(end) - timeToSec(start) + 86400) % 86400;
                    if (secs <= 0) continue;
                    allRows.push({ date: dateVal, agent, start, end, secs });
                }
            } catch(e) { console.error(e); showToast('Error parsing '+file.name, false); }
        }
        if (allRows.length === 0) {
            showToast('No valid session rows found.', false);
            return;
        }
        showToast(`Processing ${allRows.length} sessions...`, true);
        const success = await saveSessionRows(allRows);
        if (success) await refreshFromSupabase();
    }

    // ----- UI rendering (unchanged from previous working version) -----
    function renderTable() {
        if(!DATA) return;
        const agentFilter = activeAgent || document.getElementById('agent-filter').value;
        const durFilter = document.getElementById('dur-filter').value;
        let filtered = DATA.rows.filter(r => {
            if(agentFilter !== 'all' && r.agent !== agentFilter) return false;
            if(durFilter === 'short' && r.secs >= 60) return false;
            if(durFilter === 'medium' && (r.secs<60 || r.secs>=180)) return false;
            if(durFilter === 'long' && r.secs<180) return false;
            return true;
        });
        filtered.sort((a,b) => {
            let va = a[sortCol], vb = b[sortCol];
            if(sortCol === 'secs') { va=+va; vb=+vb; }
            return va < vb ? -sortDir : va > vb ? sortDir : 0;
        });
        document.getElementById('session-count').textContent = `${filtered.length} sessions`;
        document.getElementById('session-body').innerHTML = filtered.map(r => `
            <tr><td style="color:${agentColor(r.agent)};font-weight:500">${r.agent}</td>
            <td>${r.start}</td><td>${r.end}</td>
            <td><span class="dur-pill ${durClass(r.secs)}">${r.duration}</span></td>
        </tr>`).join('');
    }

    function drawTimeline() {
        if(!DATA) return;
        const svg = document.getElementById('timeline-svg');
        const buckets = DATA.buckets;
        const totals = DATA.bucket_totals;
        const maxVal = Math.max(...Object.values(totals),1);
        const w = svg.parentElement.offsetWidth || 600;
        svg.setAttribute('viewBox', `0 0 ${w} 64`);
        const barW = w / buckets.length;
        let html = '';
        buckets.forEach((b,i)=>{
            const val = totals[b] || 0;
            const h = (val / maxVal) * 46;
            const y = 46 - h;
            html += `<rect x="${i*barW+1}" y="${y}" width="${barW-2}" height="${Math.max(h,2)}" rx="2" fill="${b==='12:00'?'#4f8cff':'#2a2a32'}" stroke="#3a3a46" stroke-width="0.5" style="cursor:pointer" onmouseenter="showTip(event,'<b>${b}</b><br>${(val/60).toFixed(1)} min team admin')" onmouseleave="hideTip()"/>`;
            if(i%2===0) html += `<text x="${i*barW+barW/2}" y="60" text-anchor="middle" font-family="Geist Mono" font-size="8" fill="#6b6b80">${b}</text>`;
        });
        svg.innerHTML = html;
    }

    function buildDashboard() {
        if(!DATA) return;
        dashboardBuilt = true;
        document.getElementById('topbar-date').textContent = DATA.date;
        const sorted = [...DATA.summary].sort((a,b)=>b.total_secs - a.total_secs);
        const top = sorted[0];
        const peakEntry = Object.entries(DATA.bucket_totals).sort((a,b)=>b[1]-a[1])[0];
        document.getElementById('stats-row').innerHTML = `
            <div class="stat-card"><div class="stat-label">Team Admin Total</div><div class="stat-value">${(DATA.grand_total_secs/60).toFixed(0)}<span> min</span></div><div class="stat-sub">${DATA.rows.length} sessions · ${DATA.agents.length} agents</div></div>
            <div class="stat-card"><div class="stat-label">Agent Average</div><div class="stat-value">${(DATA.team_avg_secs/60).toFixed(1)}<span> min</span></div><div class="stat-sub">per agent</div></div>
            <div class="stat-card" style="border-color:rgba(79,140,255,0.3)"><div class="stat-label">Highest Volume</div><div class="stat-value" style="color:var(--accent)">${top.total_mins}<span> min</span></div><div class="stat-sub">${top.agent} · ${top.sessions} sessions</div></div>
            <div class="stat-card"><div class="stat-label">Peak Window</div><div class="stat-value">${peakEntry?.[0]||'—'}</div><div class="stat-sub">${peakEntry ? (peakEntry[1]/60).toFixed(1)+' min' : ''}</div></div>
        `;
        document.getElementById('peak-badge').textContent = peakEntry ? `Peak · ${peakEntry[0]}` : 'Peak · —';
        const sidebar = document.getElementById('sidebar-agents');
        sidebar.innerHTML = '';
        DATA.agents.forEach(ag => {
            const s = DATA.summary.find(x=>x.agent===ag);
            const div = document.createElement('div');
            div.className = 'agent-item';
            div.dataset.agent = ag;
            div.innerHTML = `<div class="agent-dot" style="background:${agentColor(ag)}"></div><span class="agent-name">${ag.split(' ')[0]}</span><span class="agent-mins">${s? s.total_mins : 0}m</span>`;
            div.addEventListener('click', ()=>{ activeAgent = activeAgent===ag ? null : ag; document.querySelectorAll('.agent-item').forEach(el=>el.classList.toggle('active', el.dataset.agent===activeAgent)); renderTable(); });
            sidebar.appendChild(div);
        });
        const barList = document.getElementById('bar-list');
        barList.innerHTML = '';
        const maxMins = sorted[0].total_mins;
        sorted.forEach(s=>{
            const pct = (s.total_mins/maxMins)*100;
            const div = document.createElement('div');
            div.className = 'bar-item';
            div.innerHTML = `<span class="bar-label" style="color:${agentColor(s.agent)}">${s.agent.split(' ')[0]}</span><div class="bar-track" onmouseenter="showTip(event,'<b>${s.agent}</b><br>${s.total_mins} min · ${s.sessions} sessions')" onmouseleave="hideTip()"><div class="bar-fill" style="width:${pct}%;background:${agentColor(s.agent)}">${s.total_mins}m</div></div><span class="bar-val">${s.sessions} sess</span>`;
            div.querySelector('.bar-track').addEventListener('click',()=>{ activeAgent = s.agent; renderTable(); });
            barList.appendChild(div);
        });
        const hm = document.getElementById('heatmap');
        hm.innerHTML = '';
        const agentsSorted = [...DATA.agents].sort((a,b)=> (DATA.summary.find(x=>x.agent===b).total_secs - DATA.summary.find(x=>x.agent===a).total_secs));
        const allVals = agentsSorted.flatMap(ag => DATA.buckets.map(b => DATA.timeline[ag]?.[b] || 0));
        const maxHeat = Math.max(...allVals,1);
        hm.style.gridTemplateColumns = `90px repeat(${DATA.buckets.length},1fr)`;
        const corner = document.createElement('div'); corner.className='hm-corner'; hm.appendChild(corner);
        DATA.buckets.forEach(b=>{ let d=document.createElement('div'); d.className='hm-time-label'; d.textContent=b; hm.appendChild(d); });
        agentsSorted.forEach(ag=>{
            const label=document.createElement('div'); label.className='hm-agent-label'; label.textContent=ag.split(' ')[0]; label.style.color=agentColor(ag); label.style.cursor='pointer'; label.addEventListener('click',()=>{ activeAgent=ag; renderTable(); });
            hm.appendChild(label);
            DATA.buckets.forEach(b=>{
                const val = DATA.timeline[ag]?.[b]||0;
                const intensity = maxHeat>0 ? val/maxHeat : 0;
                const cell=document.createElement('div'); cell.className='hm-cell';
                if(val>0){ cell.style.background=`rgba(79,140,255,${0.15+intensity*0.8})`; if(intensity>0.4) cell.textContent = val>30?Math.round(val/60)+'m':''; }
                else cell.style.background='rgba(255,255,255,0.02)';
                cell.addEventListener('mouseenter',(e)=>showTip(e,`<b>${ag}</b><br>${b} — ${fmtSecs(val)}`));
                cell.addEventListener('mouseleave',hideTip);
                cell.addEventListener('click',()=>{ activeAgent=ag; renderTable(); });
                hm.appendChild(cell);
            });
        });
        const agentSelect = document.getElementById('agent-filter');
        agentSelect.innerHTML = '<option value="all">All agents</option>';
        DATA.agents.forEach(ag=>{ let opt = document.createElement('option'); opt.value=ag; opt.textContent=ag; agentSelect.appendChild(opt); });
        agentSelect.onchange = ()=>{ activeAgent=null; renderTable(); };
        document.getElementById('dur-filter').onchange = ()=>{ renderTable(); };
        document.querySelectorAll('th[data-col]').forEach(th=>th.onclick = ()=>{ if(sortCol===th.dataset.col) sortDir*=-1; else { sortCol=th.dataset.col; sortDir=1; } renderTable(); });
        drawTimeline(); window.addEventListener('resize',()=>drawTimeline());
        renderTable();
    }

    function resetDashboard() { dashboardBuilt=false; buildDashboard(); }
    function setActiveDate(dateKey){
        if(!allDaysData[dateKey]) return;
        DATA = allDaysData[dateKey];
        activeAgent = null;
        sortCol='start'; sortDir=1;
        resetDashboard();
        const selector = document.getElementById('date-selector');
        if(Object.keys(allDaysData).length>1){
            selector.style.display='inline-block';
            selector.innerHTML = '';
            Object.keys(allDaysData).sort().forEach(d=>{ let opt = document.createElement('option'); opt.value=d; opt.textContent=d; if(d===dateKey) opt.selected=true; selector.appendChild(opt); });
            selector.onchange = (e)=> setActiveDate(e.target.value);
        } else selector.style.display='none';
    }

    async function init() {
        sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
            auth: { autoRefreshToken: true, persistSession: true, detectSessionInUrl: false }
        });
        const { data: { session } } = await sb.auth.getSession();
        if (!session) {
            document.body.innerHTML = '<div style="text-align:center;padding:80px;"><h2>Not authenticated</h2><p>Please log in via ScoreDesk.</p></div>';
            return;
        }
        currentUser = session.user;
        const meta = currentUser.user_metadata || {};
        isAdmin = (currentUser.email === 'admin@scoredesk.com') || (meta.role === 'admin');
        currentAgentName = meta.agent_name || null;

        const uploadZone = document.getElementById('upload-zone');
        const fileInput = document.getElementById('file-input');
        const addFilesBtn = document.getElementById('addFilesButton');

        if (isAdmin) {
            addFilesBtn.style.display = 'inline-block';
            addFilesBtn.addEventListener('click', () => fileInput.click());
            uploadZone.addEventListener('click', (e) => {
                if (e.target === uploadZone || e.target.classList.contains('upload-icon') || e.target.classList.contains('upload-title')) {
                    fileInput.click();
                }
            });
            uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
            uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
            uploadZone.addEventListener('drop', e => {
                e.preventDefault();
                uploadZone.classList.remove('drag-over');
                if (e.dataTransfer.files.length) processFiles(e.dataTransfer.files);
            });
            fileInput.addEventListener('change', () => {
                if (fileInput.files.length) processFiles(fileInput.files);
                fileInput.value = '';
            });
        } else {
            addFilesBtn.style.display = 'none';
        }

        const { error: testError } = await sb.from('admin_sessions').select('id').limit(1);
        if (testError) {
            console.error('Table access error:', testError);
            showToast('Database table "admin_sessions" not accessible. Please create it and set RLS policies.', false);
        } else {
            await refreshFromSupabase();
        }
    }

    init();
</script>
