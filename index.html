<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScoreDesk</title>
<script src="theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23e5ff8f'/%3E%3Cpath d='M20.5 11.5c-.8-1.6-2.6-2.5-4.6-2.5-2.7 0-4.6 1.4-4.6 3.5 0 4.6 9.6 2.6 9.6 7.2 0 2.2-2 3.8-4.9 3.8-2.2 0-4-1-4.9-2.7' fill='none' stroke='%23121400' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="shared.css">
<style>
html,body{height:100%;}
body{display:flex;overflow:hidden;}
.logo{width:40px;height:40px;border-radius:12px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.logo svg{width:22px;height:22px;}

/* ---------- sign in ---------- */
#loginScreen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;z-index:50;
  background:var(--bg);background-image:radial-gradient(var(--border2) 1px,transparent 1px);background-size:22px 22px;}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:40px 36px 36px;width:100%;max-width:400px;box-shadow:0 30px 80px rgba(0,0,0,.18);}
.login-box .logo{margin-bottom:26px;}
.login-title{font-size:26px;font-weight:500;letter-spacing:-.6px;}
.login-sub{font-size:13.5px;color:var(--muted2);margin:6px 0 28px;}
.login-field{margin-bottom:16px;}
.login-field label{display:block;font-size:12.5px;font-weight:500;color:var(--muted2);margin-bottom:7px;}
.login-input{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:12px 14px;border-radius:12px;font-size:14px;}
.login-input:focus{outline:2px solid var(--accent-line);outline-offset:1px;}
.pass-wrap{position:relative;}
.pass-wrap .login-input{padding-right:46px;}
.pass-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted2);cursor:pointer;width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;}
.pass-toggle:hover{background:var(--surface3);color:var(--text);}
.login-btn{width:100%;background:var(--accent);color:var(--on-accent);border:none;padding:13px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px;}
.login-btn:disabled{opacity:.55;cursor:not-allowed;}
.login-error{display:none;margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--fail-soft);color:var(--fail);font-size:13px;}
.login-theme{position:fixed;top:18px;right:18px;}

/* ---------- app shell ---------- */
#app{display:none;flex:1;height:100%;}
.rail{width:84px;flex-shrink:0;background:var(--rail);display:flex;flex-direction:column;align-items:center;padding:18px 0 16px;gap:6px;z-index:5;}
.rail .logo{margin-bottom:22px;}
.rail nav{display:flex;flex-direction:column;gap:6px;align-items:center;}
.rail .spacer{flex:1;}
.nav-tab,.rail-btn{width:64px;border:0;background:transparent;color:var(--rail-ink);border-radius:14px;padding:9px 0 7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;font-weight:500;transition:background .15s,color .15s;}
.nav-tab .ti,.rail-btn .ti{width:40px;height:32px;border-radius:11px;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s;}
.nav-tab:hover,.rail-btn:hover{color:#f2f3ee;}
.nav-tab:hover .ti,.rail-btn:hover .ti{background:rgba(255,255,255,.07);}
.nav-tab.active{color:#f2f3ee;}
.nav-tab.active .ti{background:var(--rail-active);color:#121400;}
.nav-tab:focus-visible,.rail-btn:focus-visible{outline:2px solid var(--rail-active);outline-offset:2px;}
.avatar{width:36px;height:36px;border-radius:50%;background:#2a2c2f;color:#f2f3ee;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;}
.stage{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg);}
.topbar{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:14px 28px 0;}
.who{font-size:12.5px;color:var(--muted2);cursor:pointer;padding:7px 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);display:inline-flex;align-items:center;gap:8px;}
.who:hover{border-color:var(--border2);color:var(--text);}
.frame-wrap{flex:1;position:relative;}
.frame-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg);}
.frame-wrap iframe.active{display:block;}

/* ---------- profile modal ---------- */
.modal-overlay{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:60;padding:16px;}
.modal-overlay.open{display:flex;}
.modal-overlay .modal{max-width:440px;}
.modal-body{padding:22px 26px 26px;display:flex;flex-direction:column;gap:14px;}

@media (max-width:760px){
  body{flex-direction:column;}
  #app{flex-direction:column-reverse;}
  .rail{width:100%;height:68px;flex-direction:row;padding:0 8px;justify-content:space-around;gap:0;}
  .rail .logo,.rail .spacer,.rail .acct{display:none;}
  .rail nav{flex-direction:row;gap:0;flex:1;justify-content:space-around;}
  .nav-tab,.rail-btn{width:62px;}
  .topbar{display:none;}
}
</style>
</head>
<body>

<!-- SIGN IN -->
<div id="loginScreen">
  <button class="btn login-theme" data-theme-toggle><span class="ti"></span><span class="nl"></span></button>
  <div class="login-box">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#121400" stroke-width="2.4" stroke-linecap="round"><path d="M16.5 7.5c-.7-1.4-2.2-2.2-4-2.2-2.4 0-4 1.2-4 3 0 4.1 8.4 2.3 8.4 6.3 0 1.9-1.8 3.3-4.3 3.3-1.9 0-3.5-.9-4.3-2.4"/></svg></div>
    <div class="login-title">Sign in to ScoreDesk</div>
    <div class="login-sub">Call quality and agent performance</div>
    <div class="login-field">
      <label for="loginEmail">Email</label>
      <input class="login-input" type="email" id="loginEmail" placeholder="you@company.com" autocomplete="username">
    </div>
    <div class="login-field">
      <label for="loginPass">Password</label>
      <div class="pass-wrap">
        <input class="login-input" type="password" id="loginPass" placeholder="Your password" autocomplete="current-password">
        <button type="button" class="pass-toggle" id="passToggle" aria-label="Show password"><i data-ic="eye" data-sz="18"></i></button>
      </div>
    </div>
    <button class="login-btn" id="loginBtn">Sign in</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <aside class="rail">
    <div class="logo" title="ScoreDesk"><svg viewBox="0 0 24 24" fill="none" stroke="#121400" stroke-width="2.4" stroke-linecap="round"><path d="M16.5 7.5c-.7-1.4-2.2-2.2-4-2.2-2.4 0-4 1.2-4 3 0 4.1 8.4 2.3 8.4 6.3 0 1.9-1.8 3.3-4.3 3.3-1.9 0-3.5-.9-4.3-2.4"/></svg></div>
    <nav aria-label="Sections">
      <button class="nav-tab active" data-tab="dashboard" onclick="switchTab('dashboard')"><span class="ti"><i data-ic="dashboard" data-sz="20"></i></span>Overview</button>
      <button class="nav-tab" data-tab="progression" onclick="switchTab('progression')"><span class="ti"><i data-ic="phone" data-sz="20"></i></span>Call stats</button>
      <button class="nav-tab" data-tab="quality" onclick="switchTab('quality')"><span class="ti"><i data-ic="quality" data-sz="20"></i></span>Quality</button>
      <button class="nav-tab" data-tab="analysis" onclick="switchTab('analysis')"><span class="ti"><i data-ic="target" data-sz="20"></i></span>Zero score</button>
    </nav>
    <div class="spacer"></div>
    <button class="rail-btn" data-theme-toggle><span class="ti"></span><span class="nl"></span></button>
    <button class="rail-btn acct" onclick="openProfileModal()" title="Account"><span class="ti"><span class="avatar" id="avatar">?</span></span>Account</button>
    <button class="rail-btn" id="logoutBtn" title="Sign out"><span class="ti"><i data-ic="logout" data-sz="20"></i></span>Sign out</button>
  </aside>
  <div class="stage">
    <div class="topbar"><span class="who" id="headerUserWrap" onclick="openProfileModal()"><i data-ic="user" data-sz="15"></i><span id="headerUser"></span></span></div>
    <div class="frame-wrap">
      <iframe id="frame-dashboard" class="active" data-src="dashboard.html" title="Overview"></iframe>
      <iframe id="frame-progression" data-src="agent-progression.html" title="Call stats"></iframe>
      <iframe id="frame-quality" data-src="quality.html" title="Quality"></iframe>
      <iframe id="frame-analysis" data-src="scoredesk-zero-analysis.html" title="Zero score"></iframe>
    </div>
  </div>
</div>

<!-- ACCOUNT -->
<div class="modal-overlay" id="profileModal" onclick="if(event.target===this)closeProfileModal()">
  <div class="modal">
    <div class="mh"><div><div class="t">Your account</div><div class="sub">Change your password</div></div>
      <button class="xbtn" onclick="closeProfileModal()" aria-label="Close"><i data-ic="x" data-sz="16"></i></button></div>
    <div class="modal-body">
      <div class="field" style="margin:0"><label>Email</label><input class="inp" type="email" id="profileEmail" disabled readonly></div>
      <div class="field" style="margin:0"><label>New password</label><input class="inp" type="password" id="newPassword" placeholder="At least 6 characters" autocomplete="new-password"></div>
      <div class="field" style="margin:0"><label>Confirm password</label><input class="inp" type="password" id="confirmPassword" placeholder="Repeat the new password" autocomplete="new-password"></div>
      <button class="btn primary" id="updatePasswordBtn" style="justify-content:center">Update password</button>
      <div id="profileMsg" style="display:none;font-size:13px"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// Supabase config (same as before)
const SUPABASE_URL = 'https://qbvjgiamqzkscdykenvi.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFidmpnaWFtcXprc2NkeWtlbnZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwMzUxMTIsImV4cCI6MjA5MDYxMTExMn0.OeV5qa9y_PCGw6nG0wbfPfiMBjYC_jvzsUXHOip1RTU';

let sb = null;
let currentUser = null;

function showToast(msg, ok) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (ok === true ? ' ok' : ok === false ? ' err' : '');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

window.addEventListener('load', async () => {
  try {
    if (typeof window.supabase === 'undefined') throw new Error('Supabase SDK not loaded');
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { autoRefreshToken: true, persistSession: true }
    });
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      currentUser = session.user;
      showApp();
    }
  } catch (e) {
    console.error('Init error:', e);
    document.getElementById('loginError').textContent = 'Failed to connect. Check console.';
    document.getElementById('loginError').style.display = 'block';
  }
});

document.getElementById('passToggle').addEventListener('click', function() {
  const inp = document.getElementById('loginPass');
  inp.type = inp.type === 'password' ? 'text' : 'password';
  this.innerHTML = SDTheme.icon(inp.type === 'password' ? 'eye' : 'eyeOff', 18);
  this.setAttribute('aria-label', inp.type === 'password' ? 'Show password' : 'Hide password');
});
document.querySelectorAll('[data-theme-toggle]').forEach(b => b.addEventListener('click', () => SDTheme.toggle()));
function syncThemeButtons() {
  const dark = SDTheme.get() === 'dark';
  document.querySelectorAll('[data-theme-toggle]').forEach(b => {
    b.querySelector('.ti').innerHTML = SDTheme.icon(dark ? 'sun' : 'moon', 20);
    b.title = dark ? 'Switch to light theme' : 'Switch to dark theme';
    const l = b.querySelector('.nl'); if (l) l.textContent = dark ? 'Light' : 'Dark';
  });
}
window.addEventListener('sd-theme', syncThemeButtons);
syncThemeButtons();

document.getElementById('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('logoutBtn').addEventListener('click', doLogout);
document.getElementById('updatePasswordBtn').addEventListener('click', updatePassword);

async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  const btn = document.getElementById('loginBtn');
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';
  if (!email || !pass) {
    errEl.textContent = 'Please enter email and password.';
    errEl.style.display = 'block';
    return;
  }
  btn.disabled = true;
  btn.textContent = 'Signing in…';
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) {
    errEl.textContent = /invalid|credentials/i.test(error.message) ? 'Incorrect email or password.' : error.message;
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Sign in';
    return;
  }
  const { data: { user } } = await sb.auth.getUser();
  currentUser = user;
  showApp();
}

function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('headerUser').textContent = currentUser.email;
  document.getElementById('avatar').textContent = (currentUser.email || '?').slice(0, 1).toUpperCase();
  // Load each tab with a cache-buster so it picks up the fresh session
  const timestamp = Date.now();
  document.querySelectorAll('.frame-wrap iframe').forEach(f => { f.src = f.dataset.src + '?t=' + timestamp; });
  switchTab('dashboard');
}

async function doLogout() {
  await sb.auth.signOut();
  const storageKeys = Object.keys(localStorage);
  for (const key of storageKeys) {
    if (key.includes('supabase.auth.token') || key.includes('sb-')) {
      localStorage.removeItem(key);
    }
  }
  window.location.href = window.location.pathname;
}

function switchTab(name) {
  document.querySelectorAll('.nav-tab').forEach(t => { const on = t.dataset.tab === name; t.classList.toggle('active', on); t.setAttribute('aria-current', on ? 'page' : 'false'); });
  document.querySelectorAll('.frame-wrap iframe').forEach(f => f.classList.toggle('active', f.id === 'frame-' + name));
}

// Called by the Dashboard: switch tab and ask that page to show one agent.
function openTab(name, agent) {
  switchTab(name);
  const f = document.getElementById('frame-' + name);
  if (f && agent) f.contentWindow.postMessage({ type: 'sd-agent', agent }, location.origin === 'null' ? '*' : location.origin);
}
window.openTab = openTab;

function openProfileModal() {
  const modal = document.getElementById('profileModal');
  document.getElementById('profileEmail').value = currentUser.email;
  document.getElementById('newPassword').value = '';
  document.getElementById('confirmPassword').value = '';
  document.getElementById('profileMsg').style.display = 'none';
  modal.classList.add('open');
}
function closeProfileModal() {
  document.getElementById('profileModal').classList.remove('open');
}

async function updatePassword() {
  const newPass = document.getElementById('newPassword').value.trim();
  const confirmPass = document.getElementById('confirmPassword').value.trim();
  const msgDiv = document.getElementById('profileMsg');
  if (!newPass) {
    msgDiv.textContent = 'Please enter a new password.';
    msgDiv.style.color = 'var(--fail)';
    msgDiv.style.display = 'block';
    return;
  }
  if (newPass.length < 6) {
    msgDiv.textContent = 'Password must be at least 6 characters.';
    msgDiv.style.color = 'var(--fail)';
    msgDiv.style.display = 'block';
    return;
  }
  if (newPass !== confirmPass) {
    msgDiv.textContent = 'Passwords do not match.';
    msgDiv.style.color = 'var(--fail)';
    msgDiv.style.display = 'block';
    return;
  }
  try {
    const { error } = await sb.auth.updateUser({ password: newPass });
    if (error) throw error;
    msgDiv.textContent = 'Password updated.';
    msgDiv.style.color = 'var(--pass)';
    msgDiv.style.display = 'block';
    document.getElementById('newPassword').value = '';
    document.getElementById('confirmPassword').value = '';
    setTimeout(() => closeProfileModal(), 2000);
  } catch (err) {
    msgDiv.textContent = err.message;
    msgDiv.style.color = 'var(--fail)';
    msgDiv.style.display = 'block';
  }
}
</script>
</body>
</html>
